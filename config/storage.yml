test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Set ACTIVE_STORAGE_SERVICE=s3 to use AWS S3 or a compatible self-hosted service
# such as MinIO. Keep these credentials in the deployment environment, never in Git.
s3:
  service: S3
  access_key_id: <%= ENV.fetch("S3_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("S3_SECRET_ACCESS_KEY", "") %>
  region: <%= ENV.fetch("S3_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("S3_BUCKET", "") %>
  endpoint: <%= ENV["S3_ENDPOINT"].presence %>
  force_path_style: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "true") == "true" %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>


name: vowloom

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: vowloom
      # Change this before exposing the stack beyond a local development machine.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vowloom -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
      FORCE_SSL: ${FORCE_SSL:-false}
      VOWLOOM_HOST: ${VOWLOOM_HOST:-localhost}
      VOWLOOM_DATABASE_HOST: db
      VOWLOOM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
      SOLID_QUEUE_IN_PUMA: "true"
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - media_data:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/up >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s

volumes:
  postgres_data:
  media_data:
